<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP: scripts only from this origin, API calls only to this origin or the
      HealthLog API on sslip.io. If the API moves, add it to connect-src.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.sslip.io; font-src 'self'; connect-src 'self' https://*.sslip.io; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1613" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Our weekly meal plan, and the meals worth making again." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="mealplan" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>mealplan</title>
    <script src="./api-config.js"></script>
  </head>

    <div id="app"></div>
    <noscript>mealplan needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
