name: Deploy to GitHub Pages

# Builds the app and publishes dist/ to Pages. The API origin (HealthLog's
# server) is not in the code: it comes from the repository variable
# API_BASE_URL and is written into dist/api-config.js after the build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - name: Inject API base URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "${API_BASE_URL}" || { echo "Set the API_BASE_URL repository variable"; exit 1; }
          printf 'window.APP_API_BASE = "%s";\n' "${API_BASE_URL}" > dist/api-config.js
          cat dist/api-config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
